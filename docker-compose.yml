version: "3.8"

services:
  user-service:
    build:
      context: ./services/user_service
      dockerfile: Dockerfile
    container_name: fastapi-user-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=user-service
      - ENVIRONMENT=development
      - DEBUG=True
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DB=fastapi_user_db
      - OTEL_ENABLED=True
      - OTEL_SERVICE_NAME=user-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SAMPLING_RATIO=1.0
      - LOG_FORMAT=json
      - NOTIFICATION_SERVICE_URL=http://notification-service:8006
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - notification-service

  product-service:
    build:
      context: ./services/product_service
      dockerfile: Dockerfile
    container_name: fastapi-product-service
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=product-service
      - PORT=8002
      - ENVIRONMENT=development
      - DEBUG=True
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DB=fastapi_product_db
      - OTEL_ENABLED=True
      - OTEL_SERVICE_NAME=product-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SAMPLING_RATIO=1.0
      - LOG_FORMAT=json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile
    container_name: fastapi-order-service
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=order-service
      - PORT=8003
      - ENVIRONMENT=development
      - DEBUG=True
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DB=fastapi_order_db
      - OTEL_ENABLED=True
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SAMPLING_RATIO=1.0
      - LOG_FORMAT=json
      - PRODUCT_SERVICE_URL=http://product-service:8002
      - INVENTORY_SERVICE_URL=http://inventory-service:8005
      - PAYMENT_SERVICE_URL=http://payment-service:8004
      - NOTIFICATION_SERVICE_URL=http://notification-service:8006
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - product-service
      - inventory-service
      - payment-service
      - notification-service

  payment-service:
    build:
      context: ./services/payment_service
      dockerfile: Dockerfile
    container_name: fastapi-payment-service
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=payment-service
      - PORT=8004
      - ENVIRONMENT=development
      - DEBUG=True
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DB=fastapi_payment_db
      - OTEL_ENABLED=True
      - OTEL_SERVICE_NAME=payment-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SAMPLING_RATIO=1.0
      - LOG_FORMAT=json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  inventory-service:
    build:
      context: ./services/inventory_service
      dockerfile: Dockerfile
    container_name: fastapi-inventory-service
    ports:
      - "8005:8005"
    environment:
      - SERVICE_NAME=inventory-service
      - PORT=8005
      - ENVIRONMENT=development
      - DEBUG=True
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DB=fastapi_inventory_db
      - OTEL_ENABLED=True
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SAMPLING_RATIO=1.0
      - LOG_FORMAT=json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  notification-service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    container_name: fastapi-notification-service
    ports:
      - "8006:8006"
    environment:
      - SERVICE_NAME=notification-service
      - PORT=8006
      - ENVIRONMENT=development
      - DEBUG=True
      - OTEL_ENABLED=True
      - OTEL_SERVICE_NAME=notification-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SAMPLING_RATIO=1.0
      - LOG_FORMAT=json
    extra_hosts:
      - "host.docker.internal:host-gateway"

# NOTE: Jaeger is reused from existing local Docker container (ports 16686, 4317, 4318).
# No duplicate Jaeger container is spawned here.
